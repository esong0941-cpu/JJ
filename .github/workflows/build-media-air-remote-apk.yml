name: Build Media Air Remote APK

on:
  push:
    branches: [claude/media-air-remote-design-vm7ck2]
    paths:
      - 'media_air_remote/**'
      - '.github/workflows/build-media-air-remote-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media_air_remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: media-air-remote-apk
          path: media_air_remote/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
